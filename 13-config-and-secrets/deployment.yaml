# deployment.yaml
# Purpose: Step 12 deployment + configuration from a ConfigMap and the API token
#          from a Secret (created with "oc create secret", never stored in Git).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  labels:
    app.kubernetes.io/name: notes-app
    app.kubernetes.io/part-of: notes-app
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"notes-app:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"notes-app\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-app
        app.kubernetes.io/part-of: notes-app
    spec:
      containers:
        - name: notes-app
          image: notes-app:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: notes-app-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notes-app-token
                  key: API_TOKEN

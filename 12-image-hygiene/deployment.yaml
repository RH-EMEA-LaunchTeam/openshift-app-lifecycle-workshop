# deployment.yaml
# Purpose: Run the OpenShift-ready image under the default restricted-v2 SCC.
#          Probes, resources and config injection are added in later steps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  labels:
    app.kubernetes.io/name: notes-app
    app.kubernetes.io/part-of: notes-app
  annotations:
    # Roll out automatically whenever a new image lands in notes-app:latest
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"notes-app:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"notes-app\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-app
        app.kubernetes.io/part-of: notes-app
    spec:
      containers:
        - name: notes-app
          image: notes-app:latest
          ports:
            - name: http
              containerPort: 8080

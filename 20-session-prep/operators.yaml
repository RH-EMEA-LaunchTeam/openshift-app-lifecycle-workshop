# operators.yaml
# Purpose: Platform-side prerequisites for Sessions 2 and 3, applied once per cluster by
#          the instructor (cluster-admin): the OpenShift Pipelines, Red Hat
#          Advanced Cluster Security (ACS) and Web Terminal operators.
#          Participants never apply this file.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-pipelines-operator-rh
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: notes-app
spec:
  channel: latest
  name: openshift-pipelines-operator-rh
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: v1
kind: Namespace
metadata:
  name: rhacs-operator
  labels:
    app.kubernetes.io/part-of: notes-app
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
  labels:
    app.kubernetes.io/part-of: notes-app
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
  labels:
    app.kubernetes.io/part-of: notes-app
spec:
  channel: stable
  name: rhacs-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# Web Terminal: a browser shell with oc, tkn, git and jq for participants who
# cannot install tools on their workstation. Pulls in the DevWorkspace operator.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: web-terminal
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: notes-app
spec:
  channel: fast
  name: web-terminal
  source: redhat-operators
  sourceNamespace: openshift-marketplace

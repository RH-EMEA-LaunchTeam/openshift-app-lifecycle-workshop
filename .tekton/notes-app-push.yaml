# notes-app-push.yaml
# Purpose: Pipelines as Code trigger (Session 2, Step 4). Every push to main
#          that touches app/ builds, scans and promotes the image to
#          notes-app:latest, which rolls out the Deployment.
#          Runs the notes-app-build Pipeline that already exists in the
#          namespace linked by the Repository resource.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: notes-app-push
  labels:
    app.kubernetes.io/part-of: notes-app
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-path-change: "[app/**]"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  pipelineRef:
    name: notes-app-build
  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-revision
      value: "{{ revision }}"
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: pipeline-ws

# hello-task.yaml
# Purpose: The smallest useful Task. Two steps run as two containers in one pod,
#          share a scratch directory, and run with the namespace's random UID,
#          like any other workload on the platform.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: hello-platform
  labels:
    app.kubernetes.io/part-of: notes-app
spec:
  params:
    - name: team
      type: string
      description: Name of the team running the task
      default: platform
  steps:
    - name: who-am-i
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      script: |
        #!/usr/bin/env bash
        echo "Hello, $(params.team) team"
        echo "pod:  $(hostname)"
        echo "user: $(id)"
        echo "step 1 was here" > /workspace/scratch.txt
    - name: read-scratch
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      script: |
        #!/usr/bin/env bash
        echo "pod:  $(hostname)"
        echo "file from the previous step: $(cat /workspace/scratch.txt)"
